<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      wasm-unsafe-eval: required to instantiate the Silero and Whisper WASM
        runtimes. It permits WebAssembly compilation only, not eval().
      connect-src huggingface.co/hf.co: first-run model download. Models are
        cached afterwards, so later runs need no network.
      blob:/worker-src: transformers.js runs inference off the main thread.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'wasm-unsafe-eval' blob:;
               worker-src 'self' blob:;
               style-src 'self' 'unsafe-inline';
               connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co;
               img-src 'self' data:;
               object-src 'none';
               base-uri 'none'"
    />
    <title>VoxBridge VoiceLayer</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
  </head>
  <body>
    <main id="overlayRoot" class="overlay-shell is-expanded">
      <!-- Top floating control bar removed as per request -->

      <section class="assistant-workspace" aria-label="VoxBridge VoiceLayer assistant">
        <button id="compactPill" class="compact-pill" type="button" aria-label="Expand VoxBridge">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="pill-copy">
            <strong>VoxBridge</strong>
            <small id="pillStatusText">Ready</small>
          </span>
          <span id="micBadge" class="mic-badge">Off</span>
        </button>

        <div class="workspace-panel">
<aside class="assistant-sidebar">
          <div class="brand-lockup">
            <span class="brand-mark large" aria-hidden="true"></span>
            <div>
              <p class="eyebrow">VoxBridge</p>
              <h1>VoiceLayer</h1>
            </div>
          </div>

          <div class="sidebar-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Idle</span>
            <span class="status-sep">·</span>
            <span id="modelText">Not loaded</span>
          </div>

          <div class="sidebar-divider"></div>

          <div class="sidebar-actions">
            <button id="startButton" class="sidebar-btn primary-btn" type="button">Start Listening</button>
            <button id="stopButton" class="sidebar-btn secondary-btn" type="button" disabled>Stop</button>
            <button id="testFileButton" class="sidebar-btn secondary-btn" type="button">Test with a file</button>
            <button id="copyButton" class="sidebar-btn ghost-btn" type="button">Copy transcript</button>
            <button id="clearButton" class="sidebar-btn ghost-btn" type="button">Clear All</button>
            <input id="testFileInput" type="file" accept="audio/*,video/*" hidden />
          </div>

          <div class="sidebar-divider"></div>

          <div class="caption-size" aria-label="Caption text size">
            <span class="caption-size-label">Caption size</span>
            <div class="caption-size-controls">
              <button id="captionSmaller" class="icon-button" type="button" aria-label="Smaller captions">A-</button>
              <span id="captionScaleValue">100%</span>
              <button id="captionLarger" class="icon-button" type="button" aria-label="Larger captions">A+</button>
            </div>
          </div>
        </aside>

          <section class="workspace-main">
            <header class="top-control-bar">
              <div class="language-controls" aria-label="Language settings">
                <label class="select-field" for="audioSourceSelect">
                  <span>Listen to</span>
                  <select id="audioSourceSelect">
                    <option value="system" selected>System audio (them)</option>
                    <option value="mic">Microphone (me)</option>
                  </select>
                </label>

                <label class="select-field" for="sourceLanguageSelect">
                  <span>From</span>
                  <select id="sourceLanguageSelect">
                    <option value="auto" selected>Auto-detect</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="de">German</option>
                    <option value="fr">French</option>
                    <option value="zh">Chinese</option>
                  </select>
                </label>

                <label class="select-field" for="targetLanguageSelect">
                  <span>To</span>
                  <select id="targetLanguageSelect">
                    <option value="hi" selected>Hindi</option>
                    <option value="en">English</option>
                    <option value="de">German</option>
                    <option value="fr">French</option>
                    <option value="zh">Chinese</option>
                  </select>
                </label>
              </div>

                <div class="window-controls">
                  <button id="muteButton" class="icon-button" type="button">Mute</button>
                  <button id="expandToggle" class="icon-button is-active" type="button">Full</button>
                  <button id="compactToggle" class="icon-button" type="button">Mini</button>
                  <button id="hideButton" class="icon-button" type="button" title="Hide overlay (Esc)">Hide</button>
                  <button id="quitButton" class="icon-button danger" type="button" title="Quit VoxBridge (Ctrl+Shift+Q)">Quit</button>
                </div>
            </header>

            <!-- Shown when the platform cannot capture system audio directly. -->
            <p id="audioNotice" class="audio-notice" role="status" hidden></p>

            <!-- Live input level. Distinguishes "nothing is being captured"
                 from "audio is captured but nobody is speaking". -->
            <div class="level-row" id="levelRow" hidden>
              <span class="level-label">Input</span>
              <div class="level-track" role="meter" aria-label="Input level">
                <div class="level-fill" id="levelFill"></div>
              </div>
              <span class="level-value" id="levelValue">silent</span>
            </div>

            <!-- Continuous caption ribbon: settled lines flow upward and the
                 line currently being spoken stays at the bottom. -->
            <section class="caption-stage" aria-label="Live captions">
              <div class="caption-scroll" id="captionScroll">
                <div class="caption-stream" id="captionStream" aria-live="polite"></div>
                <p class="caption-placeholder" id="captionPlaceholder">
                  Waiting for speech&hellip;
                </p>
              </div>
              <div class="caption-footer">
                <span id="languageSummary">English to Hindi</span>
                <button id="autoscrollToggle" class="link-button is-active" type="button">
                  Following
                </button>
              </div>
            </section>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="/src/renderer/renderer.js"></script>
  </body>
</html>
